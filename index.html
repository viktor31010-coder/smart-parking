<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг парковки</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #f8fafc; margin-bottom: 4px; font-size: 26px; font-weight: 800; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .tier { background: #1e293b; border-radius: 18px; padding: 20px; margin: 15px auto; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .tier-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .tier-title { font-weight: 700; color: #cbd5e1; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .tier-count { font-size: 12px; background: #334155; padding: 4px 10px; border-radius: 20px; color: #38bdf8; font-weight: 600; }
        
        .grid { display: flex; gap: 12px; justify-content: center; }
        .spot { flex: 1; padding: 20px 10px; border-radius: 14px; font-weight: bold; color: white; transition: all 0.4s ease; background: #334155; }
        
        .free { background: #16a34a; box-shadow: 0 4px 15px rgba(22,163,74,0.4); }
        .occupied { background: #dc2626; box-shadow: 0 4px 15px rgba(220,38,38,0.4); }
        
        .status-text { font-size: 15px; margin-top: 6px; font-weight: 800; letter-spacing: 0.5px; }
        .spot-num { font-size: 12px; opacity: 0.85; text-transform: uppercase; }
        
        .footer { margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <h1>Умная Парковка</h1>
    <div class="subtitle">Мониторинг мест по QR-коду</div>

    <!-- 2 Ярус -->
    <div class="tier">
        <div class="tier-header">
            <span class="tier-title">2 Ярус (Верхний)</span>
            <span class="tier-count" id="count-floor2">Свободно: ...</span>
        </div>
        <div class="grid">
            <div id="spot3" class="spot">
                <div class="spot-num">Зона 3</div>
                <div class="status-text" id="st3">Загрузка...</div>
            </div>
            <div id="spot4" class="spot">
                <div class="spot-num">Зона 4</div>
                <div class="status-text" id="st4">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- 1 Ярус -->
    <div class="tier">
        <div class="tier-header">
            <span class="tier-title">1 Ярус (Нижний)</span>
            <span class="tier-count" id="count-floor1">Свободно: ...</span>
        </div>
        <div class="grid">
            <div id="spot1" class="spot">
                <div class="spot-num">Зона 1</div>
                <div class="status-text" id="st1">Загрузка...</div>
            </div>
            <div id="spot2" class="spot">
                <div class="spot-num">Зона 2</div>
                <div class="status-text" id="st2">Загрузка...</div>
            </div>
        </div>
    </div>

    <div class="footer">Обновление данных каждые 2 секунды</div>

    <script>
        // Твой Auth Token из прошивки
        const BLYNK_TOKEN = "B6DQDkIRoN8rySG9qxS9eVgFzcnsKpSU";

        // Маппинг мест и пинов
        const SPOTS = [
            { id: 1, pin: "V1" },
            { id: 2, pin: "V2" },
            { id: 3, pin: "V3" },
            { id: 4, pin: "V4" }
        ];

        async function updateData() {
            // 1. Обновляем статус отдельных мест (V1 - V4)
            for (const spot of SPOTS) {
                try {
                    const res = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&${spot.pin}`);
                    const val = await res.text();
                    
                    const spotEl = document.getElementById(`spot${spot.id}`);
                    const textEl = document.getElementById(`st${spot.id}`);
                    
                    // Проверяем текст из твоего кода ("Занято" / "Свободно")
                    if (val.includes("Занято")) {
                        spotEl.className = "spot occupied";
                        textEl.innerText = "ЗАНЯТО";
                    } else {
                        spotEl.className = "spot free";
                        textEl.innerText = "СВОБОДНО";
                    }
                } catch (e) {
                    console.error(`Ошибка пина ${spot.pin}:`, e);
                }
            }

            // 2. Обновляем общие счетчики свободного места (V5 - 1 ярус, V6 - 2 ярус)
            try {
                const resV5 = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V5`);
                const freeV5 = await resV5.text();
                document.getElementById("count-floor1").innerText = `Свободно: ${freeV5.trim()}`;

                const resV6 = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&V6`);
                const freeV6 = await resV6.text();
                document.getElementById("count-floor2").innerText = `Свободно: ${freeV6.trim()}`;
            } catch (e) {
                console.error("Ошибка получения счетчиков:", e);
            }
        }

        // Автообновление каждые 2 секунды
        updateData();
        setInterval(updateData, 2000);
    </script>
</body>
</html>
